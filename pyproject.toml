[project]
name = "airdropbot"
version = "0.5.0"
description = "Airdrop digest Telegram bot. Routine prompts + curated sources/pinned data. Bot dispatcher TBD."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
bypass-selection = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
