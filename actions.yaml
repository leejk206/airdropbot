  - action: goto
    target: https://dashboard.3dos.io/register?ref=<REFERRAL_CODE>
  - action: fill
    target: 'Registration form: full name, email address, password, confirm password'
  - action: click
    target: Terms & Conditions checkbox
  - action: click
    target: Sign Up / Create Account button
  - action: wait
    target: Verification email delivery, then open the confirmation link in the inbox
  - action: goto
    target: https://dashboard.3dos.io/login
  - action: fill
    target: 'Login form: email and password'
  - action: click
    target: Login button
  - action: click
    target: 'Dashboard sidebar: Free Points / Daily Points page'
  - action: click
    target: Generate Point (daily claim) button
  - action: wait
    target: Confirmation toast that daily points were credited
