- project: Polymarket
  recipe_hash: sha256:4fd59529212907b503bd4f1b0c6f8b40a05524d2a8cc982e4d438c531d4688a8
  entry_url: https://polymarket.com/
  chain: Polygon
  signature_kind: approve
  approve_unlimited: true
  capital_required_usd: 50.0
  steps:
  - action: goto
    target: https://polymarket.com/
  - action: click
    target: Sign up / Log in button (top right)
  - action: wallet_connect
    target: Connect wallet (MetaMask/WalletConnect) or email login creating a Polygon
      proxy wallet
  - action: wallet_sign
    target: Sign login authentication message to link wallet to Polymarket account
  - action: wait
    target: Account/profile creation and onboarding modal to finish loading
  - action: fill
    target: Profile username field (onboarding)
  - action: click
    target: Deposit button
  - action: click
    target: Select deposit method (USDC on Polygon / bridge / card)
  - action: fill
    target: Deposit amount field (e.g. 50 USDC)
  - action: wallet_approve
    target: Approve USDC spend for deposit/bridge contract
  - action: wait
    target: Deposit confirmation and balance to appear in account
  - action: click
    target: A market card on the homepage (e.g. 'Fed Decision in September?')
  - action: click
    target: Yes or No outcome button
  - action: fill
    target: Order amount/shares input field
  - action: wallet_approve
    target: USDC ERC-20 allowance and CTF setApprovalForAll for the Polymarket exchange
      contract (first trade only)
  - action: wallet_sign
    target: Sign the EIP-712 CLOB order payload
  - action: click
    target: Buy / Place order confirmation button
  - action: wait
    target: Order fill confirmation and position to appear in Portfolio
  - action: click
    target: Portfolio / Activity tab to verify recorded trade history
  - action: click
    target: Rewards link in footer to check any active reward or leaderboard program
  automatable: manual
  blockers:
  - No official airdrop/points program is announced on the page — token reward is
    speculative, criteria unknown
  - Account signup requires email/social login (Log in / Sign up) with possible email
    or OTP verification
  - 'Geo-restrictions: US users are routed to the CFTC-regulated Polymarket US entity;
    many jurisdictions are blocked and may require KYC'
  - Requires real USDC capital deposited on Polygon to place trades; funds are at
    risk of loss
  - On first trade the proxy wallet must sign ERC-20 USDC approvals and CTF setApprovalForAll
    (typically unlimited allowance)
  - Cloudflare/bot protection and dynamic market UI make headless automation unreliable
  - Meaningful 'experience' likely needs sustained volume over weeks, not a one-off
    action
  reconned_at: '2026-08-01T10:15:00Z'
  verdict: null
