recipes:
- project: Polymarket
  recipe_hash: sha256:3497a210cbfc07aa73757cb3dfb983f46f71f20a443cac6421c693425b3d9a9e
  entry_url: https://polymarket.com/
  chain: Polygon
  signature_kind: approve
  approve_unlimited: true
  capital_required_usd: 50.0
  steps:
  - action: goto
    target: https://polymarket.com/
  - action: click
    target: Sign Up button in top-right header
  - action: fill
    target: Email address field (or choose Google / wallet login)
  - action: wait
    target: Email verification code / magic link confirmation
  - action: wallet_connect
    target: Connect wallet modal (MetaMask / WalletConnect / embedded Magic wallet)
      on Polygon
  - action: wallet_sign
    target: Sign-in authentication message to link wallet to Polymarket account
  - action: click
    target: Deposit button in header
  - action: fill
    target: USDC deposit amount (bridge/transfer USDC.e to the Polygon deposit address)
  - action: wait
    target: Deposit confirmation on Polygon and balance update
  - action: click
    target: A market card from the homepage (e.g. 'Fed Decision in July?')
  - action: click
    target: Yes or No outcome button on the market page
  - action: fill
    target: Share amount / USDC size input in the order panel
  - action: wallet_approve
    target: USDC + Conditional Tokens allowance for CTF Exchange contract (unlimited
      approval prompt)
  - action: wallet_sign
    target: EIP-712 order signature to submit the trade to the CLOB
  - action: wait
    target: Order fill confirmation and position appearing in Portfolio
  - action: click
    target: Profile menu > Portfolio / Activity to verify trade volume is recorded
  - action: click
    target: Rewards link in footer to check liquidity-reward and points eligibility
  automatable: manual
  blockers:
  - No official airdrop or token program announced; points/rewards accrual is speculative
  - Account signup requires email/OAuth (Google/Magic Link) or wallet, often with
    email verification
  - Geographic restrictions — US and several other jurisdictions are blocked on the
    international platform; Polymarket US (QCX LLC) is a separate CFTC-regulated entity
    with KYC
  - Deposit requires bridging/onramping USDC to Polygon, or fiat onramp with identity
    verification
  - Trading requires USDC allowance approvals to the CTF Exchange / conditional tokens
    contracts (typically unlimited approval)
  - Cloudflare/bot protection and captcha on signup and login flows
  - Real capital at risk — outcomes are financial bets that can lose value
  - Terms of Use prohibit automated/bot access to the UI; only the documented CLOB
    API is sanctioned
  reconned_at: '2026-07-29T11:49:54Z'
  verdict: null
