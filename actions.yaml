recipes:
- project: Polymarket
  recipe_hash: sha256:3497a210cbfc07aa73757cb3dfb983f46f71f20a443cac6421c693425b3d9a9e
  entry_url: https://polymarket.com/
  chain: Polygon
  signature_kind: approve
  approve_unlimited: true
  capital_required_usd: 50.0
  steps:
  - action: goto
    target: https://polymarket.com/
  - action: click
    target: Sign Up button in top-right header
  - action: fill
    target: Email address field (or choose Google / wallet login)
  - action: wait
    target: Email verification code / magic link confirmation
  - action: wallet_connect
    target: Connect wallet modal (MetaMask / WalletConnect / embedded Magic wallet)
      on Polygon
  - action: wallet_sign
    target: Sign-in authentication message to link wallet to Polymarket account
  - action: click
    target: Deposit button in header
  - action: fill
    target: USDC deposit amount (bridge/transfer USDC.e to the Polygon deposit address)
  - action: wait
    target: Deposit confirmation on Polygon and balance update
  - action: click
    target: A market card from the homepage (e.g. 'Fed Decision in July?')
  - action: click
    target: Yes or No outcome button on the market page
  - action: fill
    target: Share amount / USDC size input in the order panel
  - action: wallet_approve
    target: USDC + Conditional Tokens allowance for CTF Exchange contract (unlimited
      approval prompt)
  - action: wallet_sign
    target: EIP-712 order signature to submit the trade to the CLOB
  - action: wait
    target: Order fill confirmation and position appearing in Portfolio
  - action: click
    target: Profile menu > Portfolio / Activity to verify trade volume is recorded
  - action: click
    target: Rewards link in footer to check liquidity-reward and points eligibility
  automatable: manual
  blockers:
  - No official airdrop or token program announced; points/rewards accrual is speculative
  - Account signup requires email/OAuth (Google/Magic Link) or wallet, often with
    email verification
  - Geographic restrictions — US and several other jurisdictions are blocked on the
    international platform; Polymarket US (QCX LLC) is a separate CFTC-regulated entity
    with KYC
  - Deposit requires bridging/onramping USDC to Polygon, or fiat onramp with identity
    verification
  - Trading requires USDC allowance approvals to the CTF Exchange / conditional tokens
    contracts (typically unlimited approval)
  - Cloudflare/bot protection and captcha on signup and login flows
  - Real capital at risk — outcomes are financial bets that can lose value
  - Terms of Use prohibit automated/bot access to the UI; only the documented CLOB
    API is sanctioned
  reconned_at: '2026-07-29T11:49:54Z'
  verdict: null
- project: 3DOS
  recipe_hash: sha256:24b332d8948748fbee5484e40175abed9ac2a4579083379038fb87e99319f278
  entry_url: https://3dos.io/
  chain: null
  signature_kind: none
  approve_unlimited: false
  capital_required_usd: 0.0
  steps:
  - action: goto
    target: https://3dos.io/
  - action: click
    target: Login / Enter Now button in the top navigation
  - action: goto
    target: https://dashboard.3dos.io/register?ref=<REFERRAL_CODE>
  - action: fill
    target: 'Registration form: full name, email address, password, confirm password'
  - action: click
    target: Terms & Conditions checkbox
  - action: click
    target: Sign Up / Create Account button
  - action: wait
    target: Verification email delivery, then open the confirmation link in the inbox
  - action: goto
    target: https://dashboard.3dos.io/login
  - action: fill
    target: 'Login form: email and password'
  - action: click
    target: Login button
  - action: click
    target: 'Dashboard sidebar: Free Points / Daily Points page'
  - action: click
    target: Generate Point (daily claim) button
  - action: wait
    target: Confirmation toast that daily points were credited
  - action: click
    target: 'Referral page: Copy referral link, then share it to accrue referral points'
  - action: wait
    target: 24 hours, then repeat the Generate Point daily claim
  automatable: partial
  blockers:
  - Account creation requires email + password and email verification link (external
    inbox access needed)
  - Registration is referral-gated in practice; a referral code/link is required to
    get full point credit
  - Daily point generation must be repeated once per 24h, so a persistent scheduler
    and session/cookie storage are required
  - Possible CAPTCHA / bot protection on signup and login
  - Higher tiers of the DePIN program require connecting a physical 3D printer, which
    cannot be automated
  - No wallet connect flow is exposed on the landing page; a wallet link step may
    be added later for the token claim
  reconned_at: '2026-07-29T11:49:54Z'
  verdict: null
- project: AIW3
  recipe_hash: sha256:ac254dca2be85f623f39cd9ca923ac3e0a6a32b7f2a3beaf0f4505780b42ddd0
  entry_url: https://aiw3.ai/
  chain: null
  signature_kind: message
  approve_unlimited: false
  capital_required_usd: 0.0
  steps:
  - action: goto
    target: https://aiw3.ai/
  - action: click
    target: Claim Airdrop button (hero CTA)
  - action: wait
    target: Airdrop / Launch App dashboard to load
  - action: wallet_connect
    target: Connect Wallet button in app header
  - action: wallet_sign
    target: Login / authentication message signature request
  - action: wait
    target: account registration and task dashboard to load
  - action: fill
    target: referral or invite code input (if prompted)
  - action: click
    target: Tasks / Airdrop tab
  - action: click
    target: Daily check-in task 'Claim' button
  - action: click
    target: Social task entries (follow X, join Telegram/Discord) — opens external
      sites
  - action: wait
    target: external social authorization to complete
  - action: click
    target: Verify button for each completed social task
  - action: click
    target: Create API Key (for trading/strategy tasks)
  - action: fill
    target: exchange API key and secret fields
  - action: click
    target: Trading / strategy task entries and complete required actions
  - action: wait
    target: points to accrue and reach redemption threshold
  - action: click
    target: Redeem / Claim airdrop button after TGE
  - action: wallet_approve
    target: claim transaction confirmation in wallet
  automatable: partial
  blockers:
  - Landing page only exposes marketing copy and a 'Claim Airdrop' CTA; the actual
    task list lives behind the Launch App / Airdrop dashboard and is not visible without
    connecting a wallet
  - Task set is heterogeneous (social follow/retweet, daily check-in, invite friends,
    Academy courses, strategy creation, trading rebates) — social tasks require external
    OAuth on X/Discord/Telegram and are not automatable
  - Trading tasks require exchange API keys (AIW3 API key creation) and real trading
    volume, implying capital beyond zero for the full task set
  - Chain not stated on the page; TGE and claim contract network unconfirmed
  - Wallet signature type unverified — connect flow likely requires an off-chain SIWE-style
    message, and the eventual token claim would require an on-chain transaction
  - Points thresholds gate the airdrop redemption; eligibility not guaranteed by simply
    registering
  reconned_at: '2026-07-29T11:49:54Z'
  verdict: null
- project: Aligned
